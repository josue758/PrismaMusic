name: macOS validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-package:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test, build and verify distribution
        shell: bash
        run: |
          mkdir -p artifacts
          ./scripts/verify.sh 2>&1 | tee artifacts/verification.log
          cp ../Prisma-Music-*.dmg artifacts/
      - name: Keep verification log and installer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PrismaMusic-macOS-arm64
          path: |
            artifacts/verification.log
            artifacts/Prisma-Music-*.dmg
          if-no-files-found: error
          retention-days: 14
